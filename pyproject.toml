[project]
name = "fem-mfem-tools"
version = "0.1.0"
description = "Python tools for FEM_mfem result comparison and plotting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
]

[dependency-groups]
validation = [
    "numpy>=2,<3",
]

[tool.uv]
package = false
default-groups = ["validation"]
python-preference = "only-managed"
